<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINTED Europe — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #f97316;
      --accent-dim: rgba(249,115,22,0.15);
      --success: #3fb950;
      --error: #f85149;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- Header ---- */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header .logo {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      letter-spacing: -0.3px;
    }
    header .logo span { color: var(--muted); font-weight: 400; }
    .tabs {
      display: flex;
      gap: 2px;
      flex: 1;
    }
    .tab-btn {
      padding: 6px 16px;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover { background: var(--surface2); color: var(--text); }
    .tab-btn.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }

    .git-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .git-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .git-dot.changed { background: var(--accent); }

    .btn {
      padding: 7px 16px;
      border-radius: var(--radius);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #ea6c0a; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: transparent; color: var(--error); border: 1px solid var(--border); }
    .btn-danger:hover { border-color: var(--error); background: rgba(248,81,73,0.1); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ---- Layout ---- */
    .body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ---- List panel ---- */
    .list-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
    }
    .section-count {
      font-size: 13px;
      color: var(--muted);
      margin-left: 8px;
    }

    /* ---- Table ---- */
    .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 10px 14px; text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; background: var(--surface2); border-bottom: 1px solid var(--border); }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-keynote { background: rgba(249,115,22,0.2); color: var(--accent); }
    .badge-workshop { background: rgba(63,185,80,0.2); color: var(--success); }
    .badge-talk { background: rgba(139,148,158,0.2); color: var(--muted); }
    .badge-panel { background: rgba(88,166,255,0.2); color: #58a6ff; }

    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    .empty-state h3 { font-size: 15px; margin-bottom: 6px; color: var(--text); }

    /* ---- Drawer ---- */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 40;
    }
    .drawer-overlay.open { display: block; }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 540px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .drawer-title { font-size: 15px; font-weight: 600; }
    .drawer-close {
      width: 28px; height: 28px;
      border: none; border-radius: 6px;
      background: var(--surface2);
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .drawer-close:hover { color: var(--text); }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    /* ---- Form elements ---- */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="number"],
    input[type="datetime-local"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--surface); }
    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    textarea.code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; min-height: 120px; }

    .slug-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slug-prefix {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 160px;
      overflow-y: auto;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .checkbox-item input { width: auto; cursor: pointer; accent-color: var(--accent); }

    .social-list { display: flex; flex-direction: column; gap: 8px; }
    .social-item { display: flex; gap: 6px; align-items: center; }
    .social-item input { flex: 1; }
    .btn-icon { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; padding: 6px 8px; font-size: 14px; line-height: 1; }
    .btn-icon:hover { color: var(--error); border-color: var(--error); }

    /* ---- Publish modal ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 60;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 460px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal h2 { font-size: 16px; font-weight: 600; }
    .modal p { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .changes-list {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: var(--muted);
      max-height: 140px;
      overflow-y: auto;
    }
    .changes-list .added { color: var(--success); }
    .changes-list .modified { color: var(--accent); }
    .changes-list .deleted { color: var(--error); }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--success); color: #000; }
    .toast.error { background: var(--error); color: #fff; }

    /* ---- Scrollbars ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    .hidden { display: none !important; }

    .speaker-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 6px;
      background: var(--surface2);
    }
    .speaker-initials {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 6px;
      vertical-align: middle;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">PRINTED<span> / Admin</span></div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="talks">Talks & Workshops</button>
    <button class="tab-btn" data-tab="speakers">Speaker</button>
    <button class="tab-btn" data-tab="stages">Stages</button>
  </div>
  <div class="git-status">
    <div class="git-dot" id="git-dot"></div>
    <span id="git-label">Keine Änderungen</span>
  </div>
  <button class="btn btn-primary" id="publish-btn">Veröffentlichen</button>
</header>

<div class="body">
  <div class="list-panel" id="main-content">
    <!-- rendered by JS -->
  </div>
</div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title" id="drawer-title">—</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<!-- Publish modal -->
<div class="modal-overlay" id="publish-modal">
  <div class="modal">
    <h2>Auf GitHub veröffentlichen</h2>
    <p>Die Änderungen werden als Git-Commit gespeichert und gepusht. Vercel baut die Seite danach automatisch neu.</p>
    <div class="changes-list" id="publish-changes">Lade...</div>
    <div class="field">
      <label>Commit-Nachricht</label>
      <input type="text" id="commit-message" value="Schedule aktualisiert" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePublishModal()">Abbrechen</button>
      <button class="btn btn-primary" id="confirm-publish-btn" onclick="confirmPublish()">Jetzt veröffentlichen</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// State
// ============================================================
let state = {
  tab: 'talks',
  talks: [],
  speakers: [],
  stages: [],
  editingFile: null,
  editingType: null,
};

// ============================================================
// Boot
// ============================================================
async function boot() {
  await Promise.all([loadTalks(), loadSpeakers(), loadStages()]);
  renderCurrentTab();
  refreshGitStatus();
  setInterval(refreshGitStatus, 15000);
}

// ============================================================
// Data loading
// ============================================================
async function loadTalks() {
  const r = await fetch('/api/talks');
  state.talks = await r.json();
  state.talks.sort((a, b) => (a.dateTime || '').localeCompare(b.dateTime || ''));
}

async function loadSpeakers() {
  const r = await fetch('/api/speakers');
  state.speakers = await r.json();
  state.speakers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
}

async function loadStages() {
  const r = await fetch('/api/stages');
  state.stages = await r.json();
  state.stages.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
}

async function refreshGitStatus() {
  const r = await fetch('/api/git/status');
  const { changes } = await r.json();
  const dot = document.getElementById('git-dot');
  const label = document.getElementById('git-label');
  if (changes.length > 0) {
    dot.classList.add('changed');
    label.textContent = `${changes.length} Änderung${changes.length > 1 ? 'en' : ''}`;
  } else {
    dot.classList.remove('changed');
    label.textContent = 'Keine Änderungen';
  }
}

// ============================================================
// Tab navigation
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    renderCurrentTab();
    closeDrawer();
  });
});

function renderCurrentTab() {
  if (state.tab === 'talks') renderTalks();
  else if (state.tab === 'speakers') renderSpeakers();
  else if (state.tab === 'stages') renderStages();
}

// ============================================================
// Talks
// ============================================================
function renderTalks() {
  const el = document.getElementById('main-content');
  const html = `
    <div class="section-header">
      <div>
        <span class="section-title">Talks & Workshops</span>
        <span class="section-count">${state.talks.length} Einträge</span>
      </div>
      <button class="btn btn-primary" onclick="openTalkForm(null)">+ Neu anlegen</button>
    </div>
    ${state.talks.length === 0 ? `
      <div class="empty-state">
        <h3>Noch keine Talks</h3>
        <p>Lege deinen ersten Talk an.</p>
      </div>
    ` : `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Datum & Zeit</th>
            <th>Titel</th>
            <th>Stage</th>
            <th>Typ</th>
            <th>Dauer</th>
            <th>Speaker</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${state.talks.map(t => `
            <tr>
              <td style="white-space:nowrap; color: var(--muted)">${formatDateTime(t.dateTime)}</td>
              <td><strong>${esc(t.title || '—')}</strong></td>
              <td>${esc(stageName(t.stage) || '—')}</td>
              <td><span class="badge badge-${(t.type||'').toLowerCase()}">${esc(t.type || '—')}</span></td>
              <td style="color: var(--muted)">${t.duration ? t.duration + ' min' : '—'}</td>
              <td>${renderSpeakerBadges(t.speakers)}</td>
              <td>
                <div class="row-actions">
                  <button class="btn btn-ghost btn-sm" onclick="openTalkForm(${JSON.stringify(t).replace(/"/g, '&quot;')})">Bearbeiten</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteTalk('${esc(t._file)}')">Löschen</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
  el.innerHTML = html;
}

function renderSpeakerBadges(speakers) {
  if (!speakers || speakers.filter(s => s).length === 0) return '<span style="color:var(--muted)">—</span>';
  return speakers.filter(s => s).map(slug => {
    const sp = state.speakers.find(s => s.slug === slug);
    if (!sp) return `<span style="color:var(--muted)">${esc(slug)}</span>`;
    const initials = (sp.name || '?').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    return `<span title="${esc(sp.name)}"><span class="speaker-initials">${initials}</span>${esc(sp.name)}</span>`;
  }).join(', ');
}

function openTalkForm(talk) {
  state.editingFile = talk ? talk._file : null;
  state.editingType = 'talk';

  const stageOptions = state.stages.map(s =>
    `<option value="${esc(s.slug)}" ${talk && talk.stage === s.slug ? 'selected' : ''}>${esc(s.name)}</option>`
  ).join('');

  const typeOptions = ['Keynote', 'Talk', 'Workshop', 'Panel', 'Other'].map(t =>
    `<option value="${t}" ${talk && talk.type === t ? 'selected' : ''}>${t}</option>`
  ).join('');

  const speakerChecks = state.speakers.map(s => `
    <label class="checkbox-item">
      <input type="checkbox" name="speaker" value="${esc(s.slug)}"
        ${talk && talk.speakers && talk.speakers.includes(s.slug) ? 'checked' : ''}>
      ${esc(s.name)}${s.company ? ` <span style="color:var(--muted)">· ${esc(s.company)}</span>` : ''}
    </label>
  `).join('');

  const dt = talk && talk.dateTime
    ? (() => {
        const d = new Date(talk.dateTime);
        const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 16);
      })()
    : '2026-09-25T09:00';

  document.getElementById('drawer-title').textContent = talk ? 'Talk bearbeiten' : 'Neuer Talk';
  document.getElementById('drawer-body').innerHTML = `
    <div class="field-row">
      <div class="field">
        <label>Datum & Zeit</label>
        <input type="datetime-local" id="f-datetime" value="${dt}">
      </div>
      <div class="field">
        <label>Dauer (Minuten)</label>
        <input type="number" id="f-duration" value="${talk ? talk.duration || '' : ''}" min="5" step="5">
      </div>
    </div>
    <div class="field">
      <label>Titel</label>
      <input type="text" id="f-title" value="${esc(talk ? talk.title || '' : '')}"
        oninput="autoSlug(this.value, 'f-slug')">
    </div>
    <div class="field">
      <label>Slug (URL-Kennung)</label>
      <input type="text" id="f-slug" value="${esc(talk ? talk.slug || '' : '')}">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Typ</label>
        <select id="f-type">${typeOptions}</select>
      </div>
      <div class="field">
        <label>Stage</label>
        <select id="f-stage">
          <option value="">— keine —</option>
          ${stageOptions}
        </select>
      </div>
    </div>
    <div class="field">
      <label>Beschreibung</label>
      <textarea id="f-description" rows="2">${esc(talk ? talk.description || '' : '')}</textarea>
    </div>
    <div class="field">
      <label>Speaker</label>
      ${state.speakers.length === 0
        ? '<p style="font-size:13px;color:var(--muted)">Noch keine Speaker angelegt.</p>'
        : `<div class="checkbox-group">${speakerChecks}</div>`
      }
    </div>
    <div class="field">
      <label>Inhalt (Markdown)</label>
      <textarea class="code" id="f-body" rows="5">${esc(talk ? talk._body || '' : '')}</textarea>
    </div>
  `;
  document.getElementById('drawer-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeDrawer()">Abbrechen</button>
    <button class="btn btn-primary" onclick="saveTalk()">Speichern</button>
  `;
  openDrawer();
}

async function saveTalk() {
  const title = document.getElementById('f-title').value.trim();
  const slug = document.getElementById('f-slug').value.trim();
  if (!title || !slug) { showToast('Titel und Slug sind Pflichtfelder.', 'error'); return; }

  const dt = document.getElementById('f-datetime').value;
  const speakers = [...document.querySelectorAll('input[name="speaker"]:checked')].map(el => el.value);

  const data = {
    title,
    slug,
    dateTime: dt ? new Date(dt).toISOString() : '',
    description: document.getElementById('f-description').value.trim(),
    duration: parseInt(document.getElementById('f-duration').value) || 0,
    resources: [],
    speakers: speakers.length > 0 ? speakers : [''],
    stage: document.getElementById('f-stage').value,
    type: document.getElementById('f-type').value,
    _body: document.getElementById('f-body').value,
  };

  const method = state.editingFile ? 'PUT' : 'POST';
  const url = state.editingFile ? `/api/talks/${state.editingFile}` : '/api/talks';
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const res = await r.json();
  if (res.ok) {
    showToast('Talk gespeichert!', 'success');
    await loadTalks();
    renderTalks();
    closeDrawer();
    refreshGitStatus();
  } else {

function openSpeakerForm(speaker) {

  document.getElementById('drawer-body').innerHTML = `
    <div class="field-row">
      <div class="field">
        <label>Name</label>
        <input type="text" id="f-name" value="${esc(speaker ? speaker.name || '' : '')}"

      </div>
      <div class="field">
        <label>Unternehmen</label>
        <input type="text" id="f-company" value="${esc(speaker ? speaker.company || '' : '')}">
      </div>
    </div>
    <div class="field">
      <label>Slug (URL-Kennung)</label>
      <input type="text" id="f-slug" value="${esc(speaker ? speaker.slug || '' : '')}">
    </div>
    <div class="field">
      <label>Kurzbeschreibung</label>
      <input type="text" id="f-description" value="${esc(speaker ? speaker.description || '' : '')}">
    </div>
    <div class="field">
      <label>Foto-Pfad (z. B. /speaker/name.jpg)</label>
      <input type="text" id="f-image" value="${esc(speaker ? speaker.image || '' : '')}">
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none">
        <input type="checkbox" id="f-featured" style="width:auto" ${speaker && speaker.featured ? 'checked' : ''}>

      </label>
    </div>
    <div class="field">

    </div>

      <label>Bio (Markdown)</label>
      <textarea class="code" id="f-body" rows="8">${esc(speaker ? speaker._body || '' : '')}</textarea>

    <button class="btn btn-ghost" onclick="closeDrawer()">Abbrechen</button>

function socialRow(url, desc, i) {
  return `<div class="social-item" id="social-${i}">
    <input type="url" placeholder="https://..." value="${esc(url)}" style="flex:2">
    <input type="text" placeholder="Bezeichnung" value="${esc(desc)}" style="flex:1">
    <button class="btn-icon" onclick="removeSocialRow(${i})">✕</button>
  </div>`;
}

let socialCount = 10;
function addSocialRow() {
  const list = document.getElementById('social-list');
  const div = document.createElement('div');
  div.innerHTML = socialRow('', '', socialCount);
  list.appendChild(div.firstElementChild);
  socialCount++;
}

function removeSocialRow(i) {
  document.getElementById(`social-${i}`)?.remove();
}

async function saveSpeaker() {
  const name = document.getElementById('f-name').value.trim();
  const slug = document.getElementById('f-slug').value.trim();
  if (!name || !slug) { showToast('Name und Slug sind Pflichtfelder.', 'error'); return; }

  const socialItems = document.querySelectorAll('#social-list .social-item');
  const socialMedia = [...socialItems].map(row => {
    const inputs = row.querySelectorAll('input');
    return { url: inputs[0].value.trim(), description: inputs[1].value.trim() };
  }).filter(s => s.url);

  const data = {
    title: name,
    name,
    slug,
    company: document.getElementById('f-company').value.trim(),
    description: document.getElementById('f-description').value.trim(),
    featured: document.getElementById('f-featured').checked,
    image: document.getElementById('f-image').value.trim(),
    navigation: { title: name },
    socialMedia,
    _body: document.getElementById('f-body').value,
  };

  const method = state.editingFile ? 'PUT' : 'POST';
  const url = state.editingFile ? `/api/speakers/${state.editingFile}` : '/api/speakers';
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const res = await r.json();
  if (res.ok) {
    showToast('Speaker gespeichert!', 'success');
    await loadSpeakers();
    renderSpeakers();
    closeDrawer();
    refreshGitStatus();
  } else {
    showToast('Fehler: ' + res.error, 'error');
  }
}

  if (!confirm('Speaker wirklich löschen?')) return;

  const res = await r.json();

    showToast('Fehler: ' + res.error, 'error');
  }
}

function openDrawer() {

// ============================================================
// Publish
// ============================================================
document.getElementById('publish-btn').addEventListener('click', async () => {
  const modal = document.getElementById('publish-modal');
  modal.classList.add('open');
  const changesEl = document.getElementById('publish-changes');
  changesEl.innerHTML = 'Lade...';
  const r = await fetch('/api/git/status');
  const { changes } = await r.json();
  if (changes.length === 0) {
    changesEl.innerHTML = '<span style="color:var(--muted)">Keine Änderungen vorhanden.</span>';
    document.getElementById('confirm-publish-btn').disabled = true;
  } else {
    document.getElementById('confirm-publish-btn').disabled = false;
    changesEl.innerHTML = changes.map(line => {
      const type = line[0];
      const cls = type === 'A' ? 'added' : type === 'D' ? 'deleted' : 'modified';
      return `<div class="${cls}">${esc(line)}</div>`;
    }).join('');
  }
});

function closePublishModal() {
  document.getElementById('publish-modal').classList.remove('open');
}

async function confirmPublish() {
  const btn = document.getElementById('confirm-publish-btn');
  const msg = document.getElementById('commit-message').value.trim() || 'Schedule aktualisiert';
  btn.disabled = true;
  btn.textContent = 'Wird veröffentlicht...';
  const r = await fetch('/api/git/publish', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg }),
  });
  const res = await r.json();
  closePublishModal();
  if (res.ok) {
    showToast('Erfolgreich auf GitHub veröffentlicht!', 'success');
    refreshGitStatus();
  } else {
    showToast('Fehler beim Veröffentlichen: ' + res.error, 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Jetzt veröffentlichen';
}

// ============================================================
// Helpers
// ============================================================
function autoSlug(value, targetId) {
  const slugField = document.getElementById(targetId);
  if (!slugField || (slugField.dataset.manual === 'true')) return;
  slugField.value = value.toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// Mark slug as manually edited
document.addEventListener('input', e => {
  if (e.target.id === 'f-slug') e.target.dataset.manual = 'true';
});

function stageName(slug) {
  const s = state.stages.find(s => s.slug === slug);
  return s ? s.name : slug;
}

function formatDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  } catch { return iso; }
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

let toastTimer;
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
