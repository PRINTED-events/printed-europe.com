title: PRINTED Hub 2025
description: Recap of PRINTED Hub 2025 on 30 August 2025 in Rüdesheim am Rhein – talks, workshops and community for the 3D printing scene.
blocks:
  - component: AppLandingHero
    headline: Recap · 30 August 2025 · Rüdesheim am Rhein
    title: PRINTED Hub 2025
    description: Thank you for being part of the first PRINTED Hub! Talks, workshops and community in the Rheingau – with all recordings to watch again.
    links:
      - label: Watch the aftermovie
        to: /archive/hub25#aftermovie
        icon: i-lucide-play
        size: xl
      - label: Watch talks
        to: https://www.youtube.com/playlist?list=PLqJRz7k9GBbMcMnBPYPMWIhNCblq7PZA7
