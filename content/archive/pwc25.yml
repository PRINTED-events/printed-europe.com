title: PRINTED World Conference 2025
description: Recap of the first PRINTED World Conference on 22 and 23 May 2025 in Amsterdam – the global meeting point of the 3D printing community, with all recorded talks.
blocks:
  - component: AppLandingHero
    headline: Recap · 22 and 23 May 2025 · Amsterdam
    title: PRINTED World Conference 2025
    description: 'The world met in Amsterdam: the first global gathering of the 3D printing community, with talks, panel discussions, workshops and an exhibition floor full of makers, creators and engineers.'
    links:
      - label: Watch the aftermovie
        to: /archive/pwc25#aftermovie
        icon: i-lucide-play
        size: xl
      - label: Watch talks
        to: https://www.youtube.com/playlist?list=PLqJRz7k9GBbMc1Xlf9qLC2s_SzYqVRFtd
        icon: i-mdi-youtube
        target: _blank
        color: neutral
        variant: subtle
        size: xl
  - component: AppLandingStats
    title: The event in numbers
    items:
      - value: '2'
        label: Days
      - value: '24'
        label: Speakers
      - value: '20'
        label: Recorded talks
      - value: '13'
        label: Partners
  - component: AppLandingVideo
    id: aftermovie
    headline: Aftermovie
    title: Two days in Amsterdam in a few minutes.
    description: Talks, feedback and impressions from B. Amsterdam, Johan Huizingalaan 400.
    videoUrl: https://www.youtube.com/watch?v=zV_V94-Cczk
  - component: AppLandingTalkVideos
    id: talks
