title: PRINTED Hub 2026
description: Recap of PRINTED Hub 2026 – two days of 3D printing talks, workshops and community on 25 & 26 September 2026 in Rüdesheim am Rhein.
blocks:
  - component: AppLandingHero
    headline: Recap · 25 and 26 September 2026 · Rüdesheim am Rhein
    title: PRINTED Hub 2026
    description: Thank you for a successful PRINTED Hub 2026! Two days of 3D printing, workshops and community in the Rheingau – the full programme stays here to look up.
    links:
      - label: View the programme
        to: /schedule
        icon: i-lucide-calendar
        size: xl
      - label: Watch talks
        to: https://www.youtube.com/playlist?list=PLDf6XVLSvmRQ
        icon: i-lucide-play
        target: _blank
        color: neutral
        variant: subtle
        size: xl
      - label: Speakers
        to: /speakers
        icon: i-lucide-users
        color: neutral
        variant: subtle
        size: xl
  - component: AppLandingStats
    title: The event in numbers
    items:
      - value: '17'
        label: Speakers
      - value: '33'
        label: Talks & workshops
      - value: '4'
        label: Stages & spaces
      - value: '26'
        label: Partners
  - component: AppLandingVideo
    id: aftermovie
    headline: Aftermovie
    title: Two days in a few minutes.
    description: The cut of the Hub – workshop air, stage and evening programme.
    videoUrl: ''
  - component: AppLandingTalkVideos
    id: talks
    headline: All talks
    title: Watch them one by one.
    description: The recordings go online one after the other. What is finished can be started right here – the rest is already listed and will follow.
    items:
      - title: 'The Handmade Illusion: Psychologie des Verliebtseins in Kunststoff'
        speaker: Roman Rackwitz
        to: https://www.youtube.com/watch?v=w07ZD6ed16c
      - title: Taking 3D printed stop-motion animation to the next level
        speaker: Prashanthan Ganeswaran
      - title: Was wäre eine Welt ohne Kunststoffe?
        speaker: Irena Heuzeroth
        to: https://www.youtube.com/watch?v=z3YJ_9cuKOs
      - title: A UX Designer at the Printer — where product thinking meets 3D printing
        speaker: Jens Schaller
      - title: Print Stronger! Reinforcing 3D Prints with Continuous Glass or Carbon Fibre
        speaker: Lutz Feldmann
        to: https://www.youtube.com/watch?v=Y0emHdtVWwo
      - title: 'Layer by Layer: 3D Printing as Therapy'
        speaker: Rüdiger Neuweg
      - title: Mit 13 zum eigenen 3D Druck Unternehmen
        speaker: Dominik Schkalei
      - title: Hype oder Hebel? KI im 3D-Druck
        speaker: Panel · Janos Kehl, Nils Stackler, Stefan Herman
      - title: Warum ich immer wieder auf PLA zurück komme - verschiedene Materialen des 3D Drucks und ihre Anwendung
        speaker: Stefan Herman
    playlistUrl: https://www.youtube.com/playlist?list=PLDf6XVLSvmRQ
    links:
      - label: To our YouTube channel
        to: https://www.youtube.com/playlist?list=PLDf6XVLSvmRQ
        icon: i-mdi-youtube
        target: _blank
        color: neutral
        variant: outline
