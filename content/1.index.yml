title: Home
description: PRINTED Hub and the PRINTED World Conference are where the 3D printing community comes home. Get ready for the PRINTED World Conference on 21 and 22 May 2027 in Leiden near Amsterdam.
seo:
  title: Welcome to the family – PRINTED World Conference 2027
  description: Get ready for the PRINTED World Conference on 21 and 22 May 2027 in Leiden near Amsterdam. Learn. Network. Create. – where the 3D printing community comes home.
blocks:
  - component: AppLandingHeroFamily
    headline: Get ready for the PRINTED World Conference 2027
    title: Welcome to the
    titleAccent: family.
    description: PRINTED Hub and the PRINTED World Conference are where the 3D printing community comes home. You share what you've figured out, learn from people who've been there, and find a place where you belong from the moment you pick up your badge.
    claim:
      - Learn.
      - Network.
      - Create.
    image:
      src: /family/hero.jpg
      alt: Speakers and attendees together on the PRINTED stage
    links:
      - label: Save your seat
        to: /tickets
        size: xl
      - label: Watch the 2025 aftermovie
        to: /archive/pwc25#aftermovie
        icon: i-lucide-play
        color: neutral
        variant: outline
        size: xl
    editions:
      - label: PRINTED World Conference
        text: 21–22 May 2027 · Leiden near Amsterdam
    badge:
      greeting: Hi, my name is
      names:
        - Andrew
        - Joyce
        - Peter
        - Aiko
        - Mateo
        - Fatima
        - Lars
        - Priya
        - Chen
        - Amara
      role: Family
      note: First time? Perfect. Somebody will say hi before you've found the coffee.
  - component: AppLandingManifesto
    id: family
    headline: Why PRINTED feels different
    lead: Nobody comes here to sell you a printer.
    text: People come to share what they know, to learn what others found out the hard way, and to spend two days with people who
    accent: get it.
    items:
      - not: Booths and pitches
        instead: Stories and experience
      - not: Collecting business cards
        instead: Making friends
      - not: Watching from the crowd
        instead: Sitting at the same table
  - component: AppLandingVenueArea
    id: location
    headline: Location
    title: Scheltema Leiden
    description: The PRINTED World Conference 2027 takes place at Scheltema Leiden, a former blanket factory on the canal in the centre of Leiden, near Amsterdam.
    items:
      - 21 and 22 May 2027
      - Marktsteeg 1, 2312 CS Leiden, Netherlands
    image:
      src: /venues/scheltema-leiden.webp
      alt: Scheltema Leiden seen from the canal at night
    links:
      - label: Venue website
        to: https://www.scheltemaleiden.nl/
        icon: i-lucide-external-link
        target: _blank
        color: neutral
        variant: outline
      - label: Open in Google Maps
        to: https://www.google.com/maps/search/?api=1&query=Scheltema+Leiden%2C+Marktsteeg+1%2C+2312+CS+Leiden
        icon: i-lucide-map-pin
        target: _blank
        color: neutral
        variant: outline
  - component: AppLandingPillars
    headline: Learn. Network. Create.
    title: Three words. One feeling.
    description: "Our claim hasn't changed. What it means at PRINTED is simple: everyone here is family, so everyone teaches, everyone listens, and everyone gets to show what they made."
    items:
      - word: Learn.
        title: Everyone teaches. Everyone learns.
        description: The speaker from this morning sits at your table at lunch. Ask the question you didn't dare ask on stage. Beginners and veterans swap tricks here, and nobody gets looked down on.
        items:
          - Talks from people who share what worked and what failed
          - Hands-on workshops, from first print to product design
          - Every talk recorded, so you can relive it at home
        image:
          src: /family/learn.jpg
          alt: An attendee looking closely at a printer's toolhead
      - word: Network.
        title: Strangers at check-in. Friends at the after-party.
        description: Networking at PRINTED doesn't feel like networking. You end up in a long conversation at the bar, a board game with people you only knew from YouTube, and a group chat that keeps going until next year.
        items:
          - Community hangout and fun & games area
          - Dinners and after-parties at the venue
          - Creators, educators and builders on eye level
        image:
          src: /family/talk.jpg
          alt: Attendees chatting and laughing in the community area
      - word: Create.
        title: Bring what you made. Leave with what's next.
        description: Put your project on the community showcase table. You'll get curious questions, honest feedback, three new ideas, and someone who wants to build the next one with you.
        items:
          - '"Show your stuff" community showcase'
          - Recycling corner and sustainability workshops
          - Ideas that started at PRINTED and kept growing
        image:
          src: /family/show.jpg
          alt: Community members showing their printed projects
  - component: AppLandingMosaic
    headline: Atmosphere
    title: This is what coming home looks like.
    description: No stock photos. These are the people of PRINTED, at PRINTED.
    images:
      - src: /family/laugh.jpg
        alt: The audience laughing together during a talk
        caption: Laughing at the same jokes
      - src: /family/smile.jpg
        alt: Two attendees smiling with a printed project
        caption: Proud of what you made
      - src: /family/kid.jpg
        alt: A woman and a child playing a 3D printed game
        caption: The next generation at the table
      - src: /family/grin.jpg
        alt: Three attendees grinning in conversation
        caption: Old friends, new prints
      - src: /family/sofa.jpg
        alt: Creators talking on sofas on stage
        caption: Talks that feel like the living room
      - src: /family/crowd.jpg
        alt: A busy hall full of people talking
        caption: The hallway conversations
      - src: /family/lamp.jpg
        alt: Attendees admiring a tall printed lamp
        caption: Sharing the spark
  - component: AppLandingStats
    title: PRINTED in numbers
    items:
      - value: '400'
        suffix: +
        label: makers under one roof
      - value: '15'
        suffix: +
        label: speakers who stay for dinner
      - value: '2'
        label: days, one long conversation
      - value: '1'
        label: family
  - component: AppLandingAudience
    headline: You belong here
    title: There's a seat for everyone at this table.
    description: You don't need a big channel, a company or ten years of experience. If you love making things, you're already one of us.
    image:
      src: /family/kid.jpg
      alt: A woman and a child playing a printed game together
    items:
      - text: You printed your first Benchy last month
        reply: Welcome.
      - text: You run a print farm with dozens of machines
        reply: Welcome back.
      - text: You're bringing your kids along
        reply: Bring them.
      - text: You make videos, design models or teach
        reply: Share it.
      - text: You build the machines everyone else uses
        reply: Pull up a chair.
  - component: AppLandingEvents
    id: events
    headline: Printed Events
    title: Two gatherings. One family.
    description: Whether you join us on the Rhine or in Leiden, you'll recognise the faces, the laughter and the feeling of being welcome.
    items:
      - meta: 21–22 May 2027 · Leiden near Amsterdam
        title: PRINTED World Conference
        description: The family gets international. Creators, educators and builders from all over the world meet for talks, panels and conversations that carry on long after the stage lights go out.
        image:
          src: /family/pwc.jpg
          alt: Creators on stage at the PRINTED World Conference
        links:
          - label: Get tickets
            to: /tickets
            icon: i-lucide-ticket
      - meta: Rüdesheim am Rhein
        title: PRINTED Hub
        description: 'Two days in the Asbachgasse: workshops, talks, community showcase, board games and evenings with wine from the Rheingau. Thank you to everyone who made 2026 feel like home.'
        image:
          src: /family/hubstage.jpg
          alt: A packed hall at PRINTED Hub in Rüdesheim
        links:
          - label: Look back at 2026
            to: /archive/hub26
            icon: i-lucide-calendar
            color: neutral
            variant: outline
