title: Start
description: PRINTED Hub und die PRINTED World Conference sind das Zuhause der 3D-Druck-Community. Mach dich bereit für die PRINTED World Conference am 21. und 22. Mai 2027 in Leiden bei Amsterdam.
seo:
  title: Welcome to the family – PRINTED World Conference 2027
  description: Get ready for the PRINTED World Conference on 21 and 22 May 2027 in Leiden near Amsterdam. Learn. Network. Create. – where the 3D printing community comes home.
blocks:
  - component: AppLandingHeroFamily
    headline: Mach dich bereit für die PRINTED World Conference 2027
    title: Welcome to the
    titleAccent: family.
    description: Bei der PRINTED Hub und der PRINTED World Conference kommt die 3D-Druck-Community nach Hause. Du teilst, was du herausgefunden hast, lernst von Leuten, die schon dort waren, und gehörst dazu – von dem Moment an, in dem du dein Badge abholst.
    claim:
      - Learn.
      - Network.
      - Create.
    image:
      src: /family/hero.jpg
      alt: Speaker und Gäste gemeinsam auf der PRINTED-Bühne
    links:
      - label: Platz sichern
        to: /tickets
        size: xl
      - label: Aftermovie 2025 ansehen
        to: /archive/pwc25#aftermovie
        icon: i-lucide-play
        color: neutral
        variant: outline
        size: xl
    editions:
      - label: PRINTED World Conference
        text: 21.–22. Mai 2027 · Leiden bei Amsterdam
    badge:
      greeting: Hi, ich bin
      names:
        - Andrew
        - Joyce
        - Peter
        - Aiko
        - Mateo
        - Fatima
        - Lars
        - Priya
        - Chen
        - Amara
      role: Family
      note: Zum ersten Mal dabei? Perfekt. Jemand sagt Hallo, noch bevor du den Kaffee gefunden hast.
  - component: AppLandingManifesto
    id: family
    headline: Warum sich PRINTED anders anfühlt
    lead: Niemand kommt her, um dir einen Drucker zu verkaufen.
    text: Die Leute kommen, um ihr Wissen zu teilen, um zu lernen, was andere auf die harte Tour herausgefunden haben, und um zwei Tage mit Menschen zu verbringen, die
    accent: es verstehen.
    items:
      - not: Stände und Pitches
        instead: Geschichten und Erfahrung
      - not: Visitenkarten sammeln
        instead: Freundschaften schließen
      - not: Aus der Menge zuschauen
        instead: Am selben Tisch sitzen
  - component: AppLandingVenueArea
    id: location
    headline: Location
    title: Scheltema Leiden
    description: Die PRINTED World Conference 2027 findet im Scheltema Leiden statt, einer ehemaligen Wolldeckenfabrik an der Gracht im Zentrum von Leiden, in der Nähe von Amsterdam.
    items:
      - 21. und 22. Mai 2027
      - Marktsteeg 1, 2312 CS Leiden, Niederlande
    image:
      src: /venues/scheltema-leiden.webp
      alt: Scheltema Leiden bei Nacht, von der Gracht aus gesehen
    links:
      - label: Website der Location
        to: https://www.scheltemaleiden.nl/
        icon: i-lucide-external-link
        target: _blank
        color: neutral
        variant: outline
      - label: In Google Maps öffnen
        to: https://www.google.com/maps/search/?api=1&query=Scheltema+Leiden%2C+Marktsteeg+1%2C+2312+CS+Leiden
        icon: i-lucide-map-pin
        target: _blank
        color: neutral
        variant: outline
  - component: AppLandingPillars
    headline: Learn. Network. Create.
    title: Drei Worte. Ein Gefühl.
    description: 'Unser Claim ist derselbe geblieben. Was er bei PRINTED bedeutet, ist einfach: Hier sind alle Familie – also bringen alle etwas bei, alle hören zu, und alle zeigen, was sie gemacht haben.'
    items:
      - word: Learn.
        title: Alle bringen etwas bei. Alle lernen.
        description: Die Speakerin von heute Morgen sitzt mittags an deinem Tisch. Stell die Frage, die du dich auf der Bühne nicht getraut hast. Einsteiger und alte Hasen tauschen hier Tricks aus, und niemand wird belächelt.
        items:
          - Talks von Menschen, die teilen, was geklappt hat und was nicht
          - Hands-on-Workshops, vom ersten Druck bis zum Produktdesign
          - Jeder Talk wird aufgezeichnet – zum Nacherleben zu Hause
        image:
          src: /family/learn.jpg
          alt: Ein Gast betrachtet den Druckkopf eines Druckers aus der Nähe
      - word: Network.
        title: Fremde beim Check-in. Freunde auf der After-Party.
        description: Networking fühlt sich bei PRINTED nicht nach Networking an. Du landest in einem langen Gespräch an der Bar, bei einem Brettspiel mit Leuten, die du nur von YouTube kanntest, und in einem Gruppenchat, der bis zum nächsten Jahr weiterläuft.
        items:
          - Community Hangout und Fun-&-Games-Bereich
          - Abendessen und After-Partys direkt an der Location
          - Creators, Lehrende und Entwickler auf Augenhöhe
        image:
          src: /family/talk.jpg
          alt: Gäste unterhalten sich lachend im Community-Bereich
      - word: Create.
        title: Bring mit, was du gemacht hast. Geh mit dem, was als Nächstes kommt.
        description: Stell dein Projekt auf den Tisch im Community Showcase. Du bekommst neugierige Fragen, ehrliches Feedback, drei neue Ideen – und jemanden, der das nächste mit dir bauen will.
        items:
          - Community Showcase „Show your stuff“
          - Recycling Corner und Workshops zur Nachhaltigkeit
          - Ideen, die bei PRINTED entstanden und weitergewachsen sind
        image:
          src: /family/show.jpg
          alt: Community-Mitglieder zeigen ihre gedruckten Projekte
  - component: AppLandingMosaic
    headline: Atmosphäre
    title: So sieht Nachhausekommen aus.
    description: Keine Stockfotos. Das sind die Menschen von PRINTED, bei PRINTED.
    images:
