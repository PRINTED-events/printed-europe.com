      - value: '1'
        label: Familie
  - component: AppLandingAudience
    headline: Du gehörst dazu
    title: An diesem Tisch ist für alle ein Platz frei.
    description: Du brauchst keinen großen Kanal, keine Firma und keine zehn Jahre Erfahrung. Wenn du es liebst, Dinge zu machen, bist du schon eine oder einer von uns.
    image:
      src: /family/kid.jpg
      alt: Eine Frau und ein Kind spielen gemeinsam ein gedrucktes Spiel
    items:
      - text: Du hast letzten Monat dein erstes Benchy gedruckt
        reply: Willkommen.
      - text: Du betreibst eine Druckfarm mit Dutzenden Maschinen
        reply: Willkommen zurück.
      - text: Du bringst deine Kinder mit
        reply: Bring sie mit.
      - text: Du machst Videos, designst Modelle oder unterrichtest
        reply: Teil es.
      - text: Du baust die Maschinen, die alle anderen nutzen
        reply: Setz dich dazu.
  - component: AppLandingEvents
    id: events
    headline: Printed Events
    title: Zwei Treffen. Eine Familie.
    description: Ob du am Rhein oder in Leiden dabei bist – du erkennst die Gesichter wieder, das Lachen und das Gefühl, willkommen zu sein.
    items:
      - meta: 21.–22. Mai 2027 · Leiden bei Amsterdam
        title: PRINTED World Conference
        description: Die Familie wird international. Creators, Lehrende und Entwickler aus der ganzen Welt treffen sich zu Talks, Panels und Gesprächen, die weitergehen, lange nachdem das Bühnenlicht aus ist.
        image:
          src: /family/pwc.jpg
          alt: Creators auf der Bühne der PRINTED World Conference
        links:
          - label: Tickets sichern
            to: /tickets
            icon: i-lucide-ticket
      - meta: Rüdesheim am Rhein
        title: PRINTED Hub
        description: 'Zwei Tage in der Asbachgasse: Workshops, Talks, Community Showcase, Brettspiele und Abende mit Wein aus dem Rheingau. Danke an alle, durch die sich 2026 wie zu Hause angefühlt hat.'
        image:
          src: /family/hubstage.jpg
          alt: Eine volle Halle bei der PRINTED Hub in Rüdesheim
        links:
          - label: Rückblick auf 2026
            to: /archive/hub26
            icon: i-lucide-calendar
            color: neutral
            variant: outline
