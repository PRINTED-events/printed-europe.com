        caption: Stolz auf das, was du gemacht hast
      - src: /family/kid.jpg
        alt: Eine Frau und ein Kind spielen ein 3D-gedrucktes Spiel
        caption: Die nächste Generation am Tisch
      - src: /family/grin.jpg
        alt: Drei Gäste grinsen im Gespräch
        caption: Alte Freunde, neue Drucke
      - src: /family/sofa.jpg
        alt: Creators im Gespräch auf Sofas auf der Bühne
        caption: Talks wie im Wohnzimmer
      - src: /family/crowd.jpg
        alt: Eine volle Halle mit Menschen im Gespräch
        caption: Die Gespräche auf dem Flur
      - src: /family/lamp.jpg
