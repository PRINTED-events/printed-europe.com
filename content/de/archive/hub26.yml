  - component: AppLandingTalkVideos
    id: talks
    headline: Alle Talks
    title: Einzeln zum Nachschauen.
    description: Die Aufzeichnungen gehen nach und nach online. Was fertig ist, lässt sich hier direkt starten – der Rest steht schon in der Liste und wird nachgereicht.
    items:
      - title: 'The Handmade Illusion: Psychologie des Verliebtseins in Kunststoff'
        speaker: Roman Rackwitz
      - title: Taking 3D printed stop-motion animation to the next level
        speaker: Prashanthan Ganeswaran
      - title: Was wäre eine Welt ohne Kunststoffe?
        speaker: Irena Heuzeroth
      - title: A UX Designer at the Printer — where product thinking meets 3D printing
        speaker: Jens Schaller
      - title: Print Stronger! Reinforcing 3D Prints with Continuous Glass or Carbon Fibre
        speaker: Lutz Feldmann
      - title: 'Layer by Layer: 3D Printing as Therapy'
        speaker: Rüdiger Neuweg
      - title: Mit 13 zum eigenen 3D Druck Unternehmen
        speaker: Dominik Schkalei
      - title: Hype oder Hebel? KI im 3D-Druck
        speaker: Panel · Janos Kehl, Nils Stackler, Stefan Herman
      - title: Warum ich immer wieder auf PLA zurück komme - verschiedene Materialen des 3D Drucks und ihre Anwendung
        speaker: Stefan Herman
    links:
      - label: Zu unserem YouTube-Kanal
        to: https://www.youtube.com/@printed-europe
        icon: i-mdi-youtube
        target: _blank
        color: neutral
        variant: outline
